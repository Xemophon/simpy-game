[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simpy-game"
version = "0.1.0"
description = "Small project using OOP for its build"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Xemophon", email = "your-email@example.com"}]
keywords = ["console", "python", "rpg", "game"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/Xemophon/simpy-game"
Repository = "https://github.com/Xemophon/simpy-game.git"
